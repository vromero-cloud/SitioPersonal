<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos del Curso - Termodinámica</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #243b55;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 700px;
            border-top: 8px solid #008080;
        }
        h1 {
            color: #008080;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .objective-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }
        .icon {
            background: #e6f2f2;
            color: #008080;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 20px;
            flex-shrink: 0;
        }
        p {
            font-size: 1.15rem;
            line-height: 1.6;
            margin: 0;
            color: #334e68;
        }
        .highlight {
            color: #0000FF;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Objetivos del Curso</h1>

        <div class="objective-item">
            <div class="icon">1</div>
            <p>
                Describir las <span class="highlight">leyes fundamentales de la Termodinámica</span>, 
                aplicándolas al funcionamiento de las máquinas térmicas y los ciclos de potencia.
            </p>
        </div>

        

        <div class="objective-item">
            <div class="icon">2</div>
            <p>
                Evaluar la <span class="highlight">eficiencia de las máquinas térmicas</span> 
                y los ciclos de potencia de los sistemas utilizados en la industria.
            </p>
        </div>

        

    </div>

</body>
</html>
